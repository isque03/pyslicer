[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyslicer"
version = "0.2.1"
description = "A RepRap STL slicer and GCode generator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["3d-printing", "fdm", "gcode", "stl", "slicer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pyclipper>=1.3",
    "PyYAML>=6.0",
    "jsonschema>=4.18",
]

[project.urls]
Homepage = "https://github.com/isque03/pyslicer"
Issues = "https://github.com/isque03/pyslicer/issues"
Releases = "https://github.com/isque03/pyslicer/releases"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
    "pytest-cov>=4.0",
    "pillow>=13.0.0; python_version >= '3.11'",
]
demo = [
    "pillow>=13.0.0; python_version >= '3.11'",
]

[project.scripts]
pyslicer = "pyslicer.cli:main"
pyslicer-demo = "pyslicer.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyslicer = ["config.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["pyslicer"]
omit = [
    "*/pyslicer/__main__.py",
]

[tool.coverage.report]
fail_under = 81
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def to_svg",
]
