[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyslicer"
version = "0.2.0"
description = "A RepRap STL slicer and GCode generator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyclipper>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
    "pytest-cov>=4.0",
    "pillow>=10.0",
]
demo = [
    "pillow>=10.0",
]

[project.scripts]
pyslicer = "pyslicer.cli:main"
pyslicer-demo = "pyslicer.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["pyslicer"]
omit = [
    "*/pyslicer/__main__.py",
]

[tool.coverage.report]
fail_under = 81
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def to_svg",
]
